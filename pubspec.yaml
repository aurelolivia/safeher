name: safeher
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo/Arimo-VariableFont_wght.ttf
        - asset: assets/fonts/Arimo/static/Arimo-SemiBoldItalic.ttf
